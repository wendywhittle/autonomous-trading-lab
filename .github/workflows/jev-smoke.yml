name: Jev live smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "atlab/jev.py"
      - "tests/test_jev_live.py"
      - "pyproject.toml"
      - ".github/workflows/jev-smoke.yml"

jobs:
  jev-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_jev_live.py
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
