name: Jev live smoke

on:
  # Manual only: this workflow makes a real, billable TypeSafe/Jev API call.
  # It must never run on push/merge; dispatch it explicitly from the Actions tab.
  workflow_dispatch:

jobs:
  jev-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_jev_live.py
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
